; Models for llama-server in router mode, which llama.cpp calls presets.
; Each section is one model ID; its keys are llama-server's command-line
; arguments without the leading dashes.
version = 1

[*]
c = 4096
jinja = true
reasoning-format = deepseek

; All three IDs load the same file, so with two loaded (--models-max 2) a
; request to the third evicts one, without a second download. The third
; also sleeps when idle, so the sleeping state can be watched too.
[llamaRouter-llm-1]
model = /models/Qwen/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf

[llamaRouter-llm-2]
model = /models/Qwen/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf

[llamaRouter-llm-3]
model = /models/Qwen/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q8_0.gguf
sleep-idle-seconds = 30
