# A gateway config whose backends are this environment's, with facades that
# show how the gateway chooses among them. From the repo's root:
#   go run ./cmd/ai-model-facade check dev-env/gateway.yaml
#   go run ./cmd/ai-model-facade serve dev-env/gateway.yaml
# Every backend is listed whether or not it runs: one that doesn't is a
# warning, which check reports as an error, and its models count as not
# loaded. The ports are .env.example's defaults. README.md describes it.

server:
  listen: 127.0.0.1:8088

logging:
  level: info
  logSelection: true

# Each backend turns thinking off its own way, so each facade's params name
# the way its backend takes.
vars:
  llamaCppNoThinking: &llamaCppNoThinking
    chat_template_kwargs: { enable_thinking: false }
  ollamaNoThinking: &ollamaNoThinking # Ollama's /v1 ignores chat_template_kwargs
    reasoning_effort: none
  openWebUiNoThinking: &openWebUiNoThinking # passed on to Ollama's native API
    params: { think: false }

backends:
  llamaRouter:
    type: llamaServer
    baseUrl: http://127.0.0.1:18080
    requestTimeoutSeconds: 60

  llamaServer:
    type: llamaServer
    baseUrl: http://127.0.0.1:18081
    requestTimeoutSeconds: 60

  llamaSwap:
    type: llamaSwap
    baseUrl: http://127.0.0.1:18082
    requestTimeoutSeconds: 60

  ollama:
    type: ollama
    baseUrl: http://127.0.0.1:18083
    requestTimeoutSeconds: 60

  openWebUi:
    type: openWebUi
    baseUrl: http://127.0.0.1:18084
    apiKey: ${OPEN_WEBUI_API_KEY} # from control; see README.md
    requestTimeoutSeconds: 60
    # Open WebUI's connection to llama-swap reports every model as loaded,
    # so the gateway reads their state from llama-swap itself.
    llamaSwap: { backend: llamaSwap }

models:
  # Whichever of the router's first two models is loaded, loading one only
  # if neither is: a request for llamaRouter-llm-3 evicts one of them, the
  # one used least recently, and the next request here shows which.
  router:
    backend: llamaRouter
    params: *llamaCppNoThinking
    candidates:
      - model: llamaRouter-llm-1
      - model: llamaRouter-llm-2
        loadIfNone: true

  # The single-model server, which holds its one model while it runs.
  single:
    backend: llamaServer
    params: *llamaCppNoThinking
    candidates:
      - model: llamaServer-llm-1
        loadIfNone: true

  # Whichever of llama-swap's first two models is loaded, loading one only
  # if neither is: a request for llamaSwap-llm-3 evicts one of them, and the
  # next request here shows which.
  swap:
    backend: llamaSwap
    params: *llamaCppNoThinking
    candidates:
      - model: llamaSwap-llm-1
      - model: llamaSwap-llm-2
        loadIfNone: true

  # The same on Ollama.
  ollama:
    backend: ollama
    params: *ollamaNoThinking
    candidates:
      - model: ollama-llm-1:latest
      - model: ollama-llm-2:latest
        loadIfNone: true

  # The same through Open WebUI, on its connection to Ollama.
  webui:
    backend: openWebUi
    params: *openWebUiNoThinking
    candidates:
      - model: ollama-llm-1:latest
      - model: ollama-llm-2:latest
        loadIfNone: true

  # The same, with Open WebUI's memory tools, which it adds only to a
  # request that asks for them. "Save to memory that my favourite colour is
  # blue" makes the model call add_memory, which Open WebUI runs; a request
  # less direct than that, such as "Remember that ...", it answers in words.
  webui-memory:
    backend: openWebUi
    params: [*openWebUiNoThinking, { features: { memory: true } }]
    candidates:
      - model: ollama-llm-1:latest
      - model: ollama-llm-2:latest
        loadIfNone: true

  # Open WebUI's workspace model openWebUi-llm-1:NoThink, an alias of
  # ollama-llm-1 whose own params turn thinking off, so this facade doesn't:
  # the alias counts as loaded while its base is, and a request for it
  # loads its base. The facade's one param makes the gateway log, at
  # startup, that the alias's own params are applied after it.
  webui-alias:
    backend: openWebUi
    params: { max_tokens: 400 }
    candidates:
      - model: openWebUi-llm-1:NoThink
        loadIfNone: true

  # Across backends: llama-swap's first model if it is loaded, else
  # Ollama's, loading Ollama's if neither is. Each candidate carries its
  # backend's way of turning thinking off.
  either:
    backend: llamaSwap
    candidates:
      - model: llamaSwap-llm-1
        params: *llamaCppNoThinking
      - model: ollama-llm-1:latest
        backend: ollama
        params: *ollamaNoThinking
        loadIfNone: true
