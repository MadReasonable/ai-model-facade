# Real backends for checking the gateway against, one profile per backend,
# run by the control service. This file says what each container is; what
# it runs, its models and settings, is in config.yaml, which control hands
# to the containers through a Compose override of its own on every run, so
# a backend gets its settings only when control starts it. See README.md in
# this folder; .env.example lists the settings a .env file here can change.
name: ai-model-facade-dev

x-models: &models
  # A named volume unless MODELS_DIR names a host folder.
  ${MODELS_DIR:-models}:/models:ro

services:
  # Runs the environment: downloads the model files, starts and stops the
  # backends below, and loads and unloads their models, through its API. It
  # is the only service without a profile, so `docker compose up` starts it
  # alone. It runs Compose itself, through the host's Docker socket, which
  # amounts to root on most hosts, so its port stays on 127.0.0.1 whatever
  # BIND_ADDRESS says. Stopping it stops the backends first, unless
  # KEEP_BACKENDS is true; the grace period gives it time to.
  control:
    build: ./control
    environment:
      KEEP_BACKENDS: ${KEEP_BACKENDS:-}
    stop_grace_period: 60s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/work:ro
      - ${MODELS_DIR:-models}:/models
      - control:/state
    ports:
      - 127.0.0.1:${CONTROL_PORT:-18090}:8080

  # Router mode: no model on the command line, models from the presets file
  # config.yaml names.
  llama-server-router:
    profiles: [llama-server]
    image: ghcr.io/ggml-org/llama.cpp:server-b11580
    volumes:
      - *models
      - ./backend-config:/config:ro # the folder, so a reload sees an edit however it was saved
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${LLAMA_SERVER_ROUTER_PORT:-18080}:8080

  # Single-model mode: one model, and its ID, from config.yaml.
  llama-server-single:
    profiles: [llama-server]
    image: ghcr.io/ggml-org/llama.cpp:server-b11580
    volumes:
      - *models
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${LLAMA_SERVER_SINGLE_PORT:-18081}:8080

  # llama-swap, which starts a llama-server per model on demand; the image
  # bundles llama.cpp b11552.
  llama-swap:
    profiles: [llama-swap]
    image: ghcr.io/mostlygeek/llama-swap:v263-cpu-b11552-non-root
    volumes:
      - *models
      - ./backend-config:/config:ro # the folder, so a reload sees an edit however it was saved
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${LLAMA_SWAP_PORT:-18082}:8080

  # Ollama, which loads models on demand from its own store: control imports
  # the model file into it after Ollama starts, since Ollama doesn't load a
  # GGUF by path.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.8
    volumes:
      - ollama:/root/.ollama
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-18083}:11434

  # Open WebUI, connected to the backends config.yaml names. Its settings
  # come from its environment on every start, not from its database
  # (ENABLE_PERSISTENT_CONFIG).
  open-webui:
    profiles: [open-webui]
    image: ghcr.io/open-webui/open-webui:v0.12.3
    # What control's setup relies on; the admin account and the connections
    # come from config.yaml.
    environment:
      ENABLE_PERSISTENT_CONFIG: "False"
      ENABLE_SIGNUP: "False"
      ENABLE_API_KEYS: "True"
      # Fewer built-in tools, whose definitions every request through its
      # chat flow carries, so a prompt fits the small models' 4096-token
      # context; memories stay, for a tool to call.
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_NOTES: "False"
      ENABLE_AUTOMATIONS: "False"
      ENABLE_CALENDAR: "False"
      # The key that signs its sessions, generated on the first start; in
      # the volume, so a new container doesn't sign everyone out.
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${OPEN_WEBUI_PORT:-18084}:8080

  # LM Studio's headless daemon, llmster, built from lm-studio/Dockerfile,
  # since LM Studio publishes no image. It reads the shared model files in
  # place, through symlinks its start script makes for the models
  # config.yaml lists; see lm-studio/start.sh.
  lm-studio:
    profiles: [lm-studio]
    build: ./lm-studio
    # control builds this image itself before starting the service, from
    # its own mount of this folder, since Compose run inside control can't
    # read the build context at its host path.
    image: ai-model-facade-dev-lm-studio
    volumes:
      - *models
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${LM_STUDIO_PORT:-18085}:1234

volumes:
  models:
  control: # control's own state: the API key it made on Open WebUI
  ollama: # Ollama's own store, holding its imported copy of the model file
  open-webui: # Open WebUI's database: the admin account, its API key, chats
