# Builds a release when a version tag is pushed: static binaries attached to
# a draft GitHub release, and a multi-platform image on ghcr.io. The release
# stays a draft until it is published by hand; the image is pushed at once.
# The release notes are the annotated tag's message.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # v6 keeps the annotated tag; earlier versions rewrote it as a
      # lightweight one, which has no message for the release notes.
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name=ai-model-facade_${VERSION}_${os}_${arch}
            ext=
            if [ "$os" = windows ]; then ext=.exe; fi
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$name/ai-model-facade$ext" ./cmd/ai-model-facade
            cp LICENSE README.md config.example.yaml "$name/"
            if [ "$os" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          cd dist
          sha256sum * > checksums.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --notes-from-tag --title "$TAG"

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The Dockerfile cross-compiles, and the final stage only copies the
      # binary, so no emulation (QEMU) is needed for arm64.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/madreasonable/ai-model-facade
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
