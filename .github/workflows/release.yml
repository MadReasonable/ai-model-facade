# Builds a release when a version tag is pushed: static binaries attached to
# a draft GitHub release, and a multi-platform image on ghcr.io. The release
# stays a draft until it is published by hand; the image is pushed at once.
# The release notes are the version's section of CHANGELOG.md, which is
# written for users; the annotated tag's message is for developers.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # v6 keeps the annotated tag; earlier versions rewrote it as a
      # lightweight one, which has no message for the release notes.
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name=ai-model-facade_${VERSION}_${os}_${arch}
            ext=
            if [ "$os" = windows ]; then ext=.exe; fi
            mkdir "$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$name/ai-model-facade$ext" ./cmd/ai-model-facade
            cp LICENSE README.md CHANGELOG.md config.example.yaml "$name/"
            if [ "$os" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          cd dist
          sha256sum * > checksums.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release candidate takes the notes of the version it leads to, or
        # Unreleased before that section is named. --generate-notes appends
        # GitHub's link to the diff from the previous release.
        run: |
          version=${TAG#v}
          version=${version%%-rc.*}
          section() {
            awk -v v="$1" '/^## \[/ { if (found) exit; found = index($0, "## [" v "]") == 1; next } found' CHANGELOG.md
          }
          prerelease=
          notes=$(section "$version")
          case "$TAG" in
            *-rc.*)
              prerelease=--prerelease
              if [ -z "$notes" ]; then notes=$(section Unreleased); fi
              ;;
          esac
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section '## [$version]'; rename '## [Unreleased]' to '## [$version] - <date>' before tagging"
            exit 1
          fi
          printf '%s\n\n### Docker image\n- `ghcr.io/madreasonable/ai-model-facade:%s`\n' "$notes" "${TAG#v}" > notes.md
          gh release create "$TAG" dist/* --draft $prerelease --verify-tag --notes-file notes.md --generate-notes --title "$TAG"

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The Dockerfile cross-compiles, and the final stage only copies the
      # binary, so no emulation (QEMU) is needed for arm64.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/madreasonable/ai-model-facade
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
