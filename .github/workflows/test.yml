# Runs gofmt, go vet and the race-enabled tests on every push to master, on
# every pull request, when another workflow calls it, and when started by
# hand. Version tags are tested by release.yml before it builds.
name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Unformatted code would show up as unrelated whitespace changes in
      # the diff of whoever next edits the file with format-on-save.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not formatted with gofmt; run 'gofmt -w' on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      # dev-env/control is a module of its own, which ./... doesn't reach.
      - run: go vet ./...
        working-directory: dev-env/control
      - run: go test -race ./...
        working-directory: dev-env/control
